<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Canvas Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1035" />
    </linearGradient>

    <!-- Glowing Text & Shape Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    @keyframes drawPath {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .bg-grid { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: floatCard 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 6s ease-in-out infinite 1s; }
    .animated-stroke {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawPath 4s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite alternate;
    }
    .glowing-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; }
    .sub-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" class="bg-grid" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#c084fc" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="180" r="180" fill="#f43f5e" opacity="0.08" filter="url(#glow)" />

  <!-- Whiteboard Elements / Sticky Notes (Right Side Visuals) -->
  <g class="floating-card-1" filter="url(#shadow)">
    <!-- Yellow Sticky Note -->
    <rect x="860" y="50" width="130" height="130" rx="8" fill="#fef08a" transform="rotate(4 925 115)" />
    <line x1="880" y1="80" x2="960" y2="80" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" transform="rotate(4 925 115)" />
    <line x1="880" y1="105" x2="940" y2="105" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" transform="rotate(4 925 115)" />
    <line x1="880" y1="130" x2="920" y2="130" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" transform="rotate(4 925 115)" />
  </g>

  <g class="floating-card-2" filter="url(#shadow)">
    <!-- Cyan Card -->
    <rect x="970" y="140" width="140" height="110" rx="10" fill="#38bdf8" fill-opacity="0.9" transform="rotate(-6 1040 195)" />
    <circle cx="1000" cy="175" r="12" fill="#ffffff" transform="rotate(-6 1040 195)" />
    <line x1="1025" y1="175" x2="1085" y2="175" stroke="#ffffff" stroke-width="4" stroke-linecap="round" transform="rotate(-6 1040 195)" />
    <line x1="1000" y1="210" x2="1070" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" transform="rotate(-6 1040 195)" />
  </g>

  <!-- Drawn Vector Paths (Simulating Whiteboard Ink) -->
  <path class="animated-stroke" d="M 720 250 Q 800 120 900 220 T 1080 100" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 150 290 Q 300 340 450 280" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Collaborative Cursors -->
  <g transform="translate(730, 220) rotate(-20)" filter="url(#shadow)">
    <path d="M 0 0 L 0 24 L 6 18 L 14 26 L 18 22 L 10 14 L 18 10 Z" fill="#f43f5e" />
    <rect x="18" y="18" width="65" height="22" rx="4" fill="#f43f5e" />
    <text x="24" y="33" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold">Alex (Host)</text>
  </g>

  <g transform="translate(1010, 80) rotate(-15)" filter="url(#shadow)">
    <path d="M 0 0 L 0 24 L 6 18 L 14 26 L 18 22 L 10 14 L 18 10 Z" fill="#10b981" />
    <rect x="18" y="18" width="55" height="22" rx="4" fill="#10b981" />
    <text x="24" y="33" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold">Sarah</text>
  </g>

  <!-- Main Banner Header Text -->
  <g transform="translate(80, 140)">
    <!-- Subtitle Category Badge -->
    <rect x="0" y="-75" width="280" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <text x="16" y="-53" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700" letter-spacing="1.5">🚀 AWESOME-WHITEBOARDING</text>

    <!-- Main Title -->
    <text x="0" y="10" fill="url(#titleGrad)" class="glowing-title" font-size="48" letter-spacing="-1" filter="url(#glow)">Visual Collaboration Ecosystem</text>
    
    <!-- Description -->
    <text x="0" y="50" fill="#94a3b8" class="sub-title" font-size="19">
      Curated SaaS platforms &amp; open-source digital whiteboards,
    </text>
    <text x="0" y="78" fill="#94a3b8" class="sub-title" font-size="19">
      infinite canvases, diagramming tools, and real-time visual workspaces.
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="15" y="19" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">🎨 Infinite Canvas</text>

      <rect x="142" y="0" width="145" height="30" rx="15" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1" />
      <text x="157" y="19" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">⚡ Real-time Sync</text>

      <rect x="299" y="0" width="140" height="30" rx="15" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1" />
      <text x="314" y="19" fill="#f43f5e" font-family="system-ui" font-size="12" font-weight="600">🔓 Self-Hostable</text>
    </g>
  </g>
</svg>
